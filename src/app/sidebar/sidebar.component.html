<div class="sidebar">
    <div class="logo-section">
        <div class="logo">
            <!-- <i class="fas fa-blender"></i> -->
            <img src="../../assets/iqf-logo-white.svg" alt="IQ Logo" class="iq-logo">
        </div>
    </div>
    
    <div class="navigators">
        <!-- Dashboard -->
        <div *ngIf="acl.canRead('Dashboard')" class="nav-item" [ngClass]="{'selected': selectedIndex === 0}" (click)="selectOption(0)" title="Dashboard">
            <i class="fas fa-tachometer-alt"></i>
            <span class="nav-label">Dashboard</span>
        </div>
        
        <!-- Storage Warehouse -->
        <div *ngIf="acl.canRead('Storage House')" class="nav-item" [ngClass]="{'selected': selectedIndex === 1}" (click)="selectOption(1)" title="Storage Warehouse">
            <i class="fas fa-warehouse"></i>
            <span class="nav-label">GSL Warehouse</span>
        </div>

         <!-- Storage Warehouse 2-->
         <div *ngIf="acl.canRead('Storage House 2')" class="nav-item" [ngClass]="{'selected': selectedIndex === 2}" (click)="selectOption(2)" title="Storage Warehouse 2">
            <i class="fas fa-building"></i>
            <span class="nav-label">Sevenseas Warehouse</span>
        </div>
        
        <!-- Main Warehouse -->
        <div *ngIf="acl.canRead('Life Smoothie House')" class="nav-item" [ngClass]="{'selected': selectedIndex === 3}" (click)="selectOption(3)" title="Main Warehouse">
            <i class="fas fa-industry"></i>
            <span class="nav-label">Life Smoothie House</span>
        </div>
        
        <!-- Smoothie Production -->
        <div *ngIf="acl.canRead('Production')" class="nav-item" [ngClass]="{'selected': selectedIndex === 4}" (click)="selectOption(4)" title="Smoothie Production">
            <i class="fas fa-glass-whiskey"></i>
            <span class="nav-label">Production</span>
        </div>
        
        <!-- Dispatch Products -->
        <div *ngIf="acl.canRead('Dispatch')" class="nav-item" [ngClass]="{'selected': selectedIndex === 5}" (click)="selectOption(5)" title="Dispatch Products">
            <i class="fas fa-shipping-fast"></i>
            <span class="nav-label">Dispatch</span>
        </div>
        
        <!-- Forecast Report -->
        <div *ngIf="acl.canRead('Forecast')" class="nav-item" [ngClass]="{'selected': selectedIndex === 6}" (click)="selectOption(6)" title="Forecast Report">
            <i class="fas fa-chart-line"></i>
            <span class="nav-label">Forecast</span>
        </div>
        
        <!-- User Management -->
        <div *ngIf="acl.canRead('User Management')" class="nav-item" [ngClass]="{'selected': selectedIndex === 7}" (click)="selectOption(7)" title="User Management">
            <i class="fas fa-users-cog"></i>
            <span class="nav-label">Users</span>
        </div>
    </div>
    
    <div class="sidebar-footer">
        <div class="nav-item logout" (click)="logout()" title="Logout">
            <i class="fas fa-sign-out-alt"></i>
            <span class="nav-label">Logout</span>
        </div>
    </div>
</div>
