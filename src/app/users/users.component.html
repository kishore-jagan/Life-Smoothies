<div class="users-container">
    <!-- Header -->
    <div class="users-header">
  
      <!-- Header Row -->
      <div class="users-header-row">
  
        <!-- Title + Description -->
        <div class="users-title">
          <div class="users-title-row">
            <i class="pi pi-users gradient-text" style="font-size: 1.5rem;"></i>
            <h1 class="users-title-text gradient-text">User
              Management</h1>
          </div>
          <p class="users-subtitle gradient-text" style="font-size: 0.8rem;">
            Manage Users, Roles, and Permissions.
          </p>
        </div>
  
        <!-- Navigator -->
        <nav class="users-nav">
          <!-- Users -->
          <button (click)="setActive(0)" [ngClass]="activeIndex === 0 ? 'nav-btn--active' : 'nav-btn--inactive'"
            class="nav-btn">
            <i class="pi pi-users nav-btn-icon"></i>
            Users
          </button>
  
          <!-- Roles & Permissions -->
          <button (click)="setActive(1)" [ngClass]="activeIndex === 1 ? 'nav-btn--active' : 'nav-btn--inactive'"
            class="nav-btn">
            <i class="pi pi-shield nav-btn-icon"></i>
            Roles & Permissions
          </button>
  
          <!-- Add & Edit Users -->
          <button (click)="setActive(2)" [ngClass]="activeIndex === 2 ? 'nav-btn--active' : 'nav-btn--inactive'"
            class="nav-btn">
            <i class="pi pi-user-edit nav-btn-icon"></i>
            Add & Edit Users
          </button>
  
          <!-- <button (click)="setActive(3)" [ngClass]="activeIndex === 3 
        ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white' 
        : 'text-gray-600 hover:bg-gray-100'"
            class="flex items-center justify-center gap-2 min-w-[180px] h-8 rounded-md font-medium transition-all cursor-pointer">
            <i class="pi pi-user-edit text-lg"></i>
            Test
          </button> -->
        </nav>
  
  
        <!-- Search Box -->
        <!-- <div class="flex items-center w-full sm:w-64 bg-gray-100 rounded-xl px-3">
          <i class="pi pi-search text-gray-500 text-lg"></i>
          <input type="text" placeholder="Search..." [(ngModel)]="searchTerm"
            class="bg-transparent w-full py-2 px-2 focus:outline-none text-sm" />
        </div> -->
      </div>
    </div>
  
    <!-- Section content -->
    <div class="section-content">
      <!-- <app-userlist *ngIf="activeIndex === 3" [search]="searchTerm"></app-userlist> -->
      <app-list *ngIf="activeIndex === 0" [search]="searchTerm"></app-list>
      <app-role *ngIf="activeIndex === 1" [search]="searchTerm"></app-role>
      <app-adduser *ngIf="activeIndex === 2"></app-adduser>
    </div>
  </div>
